<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1000" height="610" fill="#fbfbfd"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f3f46"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="21" font-weight="600" fill="#18181b">Two enforcement layers, decided locally</text>
  <text x="40" y="70" font-size="14" fill="#52525b">The agent keeps every capability it had. Only what it can reach changes.</text>

  <!-- ============ LAYER 1: sandbox ============ -->
  <rect x="40" y="110" width="250" height="250" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="56" y="136" font-size="12" font-weight="700" fill="#6d28d9" letter-spacing="0.6">LAYER 1 &#183; THE NETWORK</text>
  <text x="56" y="154" font-size="12" fill="#6d28d9">NemoClaw sandbox policy</text>

  <rect x="62" y="172" width="206" height="100" rx="9" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="78" y="198" font-size="14" font-weight="600" fill="#18181b">Lena&#8217;s own agent</text>
  <text x="78" y="219" font-size="12" fill="#52525b">OpenClaw, bring&#8209;your&#8209;own</text>
  <text x="78" y="241" font-size="12" fill="#52525b">Shell, code, network:</text>
  <text x="78" y="259" font-size="12" font-weight="600" fill="#15803d">all still available</text>

  <text x="62" y="300" font-size="11.5" fill="#6d28d9">Governs which binaries reach</text>
  <text x="62" y="318" font-size="11.5" fill="#6d28d9">which hosts, so the agent</text>
  <text x="62" y="336" font-size="11.5" fill="#6d28d9">cannot go around the gateway.</text>

  <!-- ============ LAYER 2: gateway ============ -->
  <rect x="370" y="110" width="270" height="300" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="386" y="136" font-size="12" font-weight="700" fill="#1e40af" letter-spacing="0.6">LAYER 2 &#183; DATA ACCESS</text>
  <text x="386" y="154" font-size="12" fill="#1e40af">n8n access gateway</text>

  <rect x="390" y="170" width="230" height="30" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="404" y="190" font-size="12.5" fill="#18181b">Identity &#38; entitlements</text>
  <rect x="390" y="206" width="230" height="30" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="404" y="226" font-size="12.5" fill="#18181b">Data classification</text>
  <rect x="390" y="242" width="230" height="30" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="404" y="262" font-size="12.5" fill="#18181b">Egress guard &#183; provenance</text>
  <rect x="390" y="278" width="230" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="404" y="300" font-size="12.5" font-weight="600" fill="#1e3a8a">Policy decision</text>
  <rect x="390" y="318" width="230" height="30" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="404" y="338" font-size="12.5" fill="#18181b">Sanctioned path (the redirect)</text>
  <rect x="390" y="354" width="230" height="30" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="404" y="374" font-size="12.5" fill="#18181b">Append&#8209;only audit log</text>

  <!-- ============ DATA ESTATE ============ -->
  <rect x="720" y="110" width="240" height="250" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="736" y="136" font-size="12" font-weight="700" fill="#3f3f46" letter-spacing="0.6">COMPANY DATA</text>

  <rect x="738" y="152" width="204" height="42" rx="7" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="750" y="170" font-size="11.5" font-weight="600" fill="#18181b">fleet.night_clips_annotated</text>
  <text x="750" y="186" font-size="10.5" fill="#b91c1c">RESTRICTED &#183; EU&#8209;DE&#8209;ONLY &#183; 48,217</text>

  <rect x="738" y="202" width="204" height="42" rx="7" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="750" y="220" font-size="11.5" font-weight="600" fill="#18181b">models.pedestrian_v4</text>
  <text x="750" y="236" font-size="10" fill="#a16207">CONFIDENTIAL &#183; inherits residency</text>

  <rect x="738" y="252" width="204" height="42" rx="7" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="750" y="270" font-size="11.5" font-weight="600" fill="#18181b">fleet.night_clips_redacted</text>
  <text x="750" y="286" font-size="10.5" fill="#a16207">CONFIDENTIAL &#183; EU &#183; 12,904</text>

  <rect x="738" y="302" width="204" height="42" rx="7" fill="#f0fdf4" stroke="#86efac"/>
  <text x="750" y="320" font-size="11.5" font-weight="600" fill="#18181b">ops.gpu_cluster_metrics</text>
  <text x="750" y="336" font-size="10.5" fill="#15803d">INTERNAL &#183; EU</text>

  <!-- ============ ARROWS ============ -->
  <line x1="292" y1="215" x2="366" y2="215" stroke="#3f3f46" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="296" y="205" font-size="11.5" font-weight="600" fill="#18181b">MCP</text>
  <text x="296" y="238" font-size="11" fill="#52525b">the only</text>
  <text x="296" y="252" font-size="11" fill="#52525b">route in</text>

  <line x1="644" y1="248" x2="716" y2="248" stroke="#3f3f46" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650" y="240" font-size="11" fill="#52525b">if allowed</text>

  <!-- blocked direct route: dies at the layer-1 boundary, kept in the left column -->
  <path d="M 200 364 Q 258 420 286 428" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="288" y1="416" x2="316" y2="444" stroke="#b91c1c" stroke-width="3.2"/>
  <line x1="316" y1="416" x2="288" y2="444" stroke="#b91c1c" stroke-width="3.2"/>
  <text x="40" y="470" font-size="12" font-weight="600" fill="#b91c1c">Copy it out directly, skipping the gateway</text>
  <text x="40" y="488" font-size="11.5" fill="#b91c1c">Refused at layer 1. The gateway never sees it.</text>

  <!-- policy brain -->
  <rect x="330" y="505" width="350" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="348" y="529" font-size="13" font-weight="600" fill="#065f46">Nemotron policy brain</text>
  <text x="348" y="549" font-size="11.5" fill="#047857">Rules decide the verdict. The model explains it</text>
  <text x="348" y="566" font-size="11.5" fill="#047857">and picks a redirect from the sanctioned set.</text>

  <line x1="505" y1="412" x2="505" y2="501" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)" marker-start="url(#arrowGreen)"/>
  <text x="516" y="452" font-size="11" fill="#047857">local inference</text>

  <text x="712" y="527" font-size="11.5" fill="#52525b">Hosted endpoint while building;</text>
  <text x="712" y="545" font-size="11.5" fill="#52525b">on the box beside the data for</text>
  <text x="712" y="563" font-size="11.5" fill="#52525b">the sovereign deployment.</text>
</svg>
