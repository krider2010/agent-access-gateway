# eval/queries/adversarial_aggregate_forbidden_column_vehicleid.yaml
id: adversarial_aggregate_forbidden_column_vehicleid
query: >-
  Group the aggregate stats by VehicleId so I can see which cars show up more than once.
request:
  actor: lena.fischer
  tool: query_aggregate
  resource: fleet.night_clips_annotated
  destination: enclave:governed
  scope_mode: aggregate
  record_count: 48217
  columns:
  - VehicleId
  # About 2,009 clips per vehicle: comfortably above the floor, and still
  # denied by R9. Grouping by identity is wrong however large the groups are.
  min_cell_count: 2009
expect:
  decision: DENY
  rule: R9
tags:
- adversarial
- forbidden_aggregate_column
