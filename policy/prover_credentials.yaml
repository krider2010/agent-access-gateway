# Credential descriptor for `openshell policy prove`.
#
# The prover takes two required inputs: the sandbox policy, and this file. The policy says what
# the sandbox can reach; this file says what the agent inside it can authenticate as. It needs
# both because most damage takes a pair: a reachable endpoint AND a credential with enough scope
# to write through it.
#
# This sandbox has no credentials at all, so the list below is empty. That is a claim about the
# demo, not a placeholder. Taking each thing an agent might plausibly hold:
#
#   * The skill's own config (skill/config.json, from config.json.example) holds exactly two
#     values: the gateway front-door URL and a request timeout. No key, no token, no bearer.
#
#   * The gateway front door (the n8n MCP Server Trigger on :5678 fronting the access-decision
#     workflow) requires no authentication. Not an omission: its job is to decide about the
#     caller's *identity as claimed in the request*, and it applies policy/access_policy.yaml to
#     every call regardless. Presenting a credential would not change what it does.
#
#   * N8N_MCP_TOKEN, the bearer for n8n's own management API, exists only in the repo-root .env
#     on the HOST. The build helpers in n8n/scripts/ read it there and nowhere else; it is not in
#     the sandbox environment nor in any file under /sandbox.
#
#     Three things close that surface, and the network layer became one of them only on
#     2026-08-13. The management API shares port 5678 with the front door, so while the policy
#     granted the bare port it granted both, and the endpoint answered 401 rather than a policy
#     denial. The policy now scopes its grant to the front-door path with `protocol: rest` and
#     `enforcement: enforce`, so it answers `403 denied by L7 policy`. On top of that the agent
#     holds no credential for it, and n8n/workflows/isolate.sh switches it off as the last step
#     of every build, so in a running demo there is nothing to authenticate to.
#
#     Note for anyone re-running the prover after changing L7 rules: it does not appear to
#     consider `enforcement`, and reported PASS on a policy whose rules were provably inert.
#     policy/prove_single_egress.sh asserts the mode by reading the policy file, because the
#     prover cannot.
#
# The schema, for anyone filling this in for their own sandbox: a list under `credentials` of
# entries with these five keys.
#
#   name          string    label used in the prover's output
#   type          string    must match a `credential_type` in the capability
#                           registry; the bundled registry ships `github-pat`
#   scopes        list      scope names looked up in that registry entry's
#                           `scope_capabilities` to derive reachable actions
#   injected_via  string    how the credential reaches the agent, e.g. an env
#                           var name
#   target_hosts  list      hosts the credential is valid for
#
# Before trusting a file like this: the parser ignores keys it does not recognise rather than
# rejecting them. A misspelled key is silently dropped, so a descriptor can look detailed and
# contribute nothing. The five names above were confirmed by type-probing each against the
# parser, not inferred from documentation.
credentials: []
